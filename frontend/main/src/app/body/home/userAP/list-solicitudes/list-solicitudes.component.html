<div class="container-solic" [style.background-image]="'url('+apvidaBackground+')'">

  <div class="container-list-solicitud">

    <button class="btn btn-danger rounded" (click)="back()">
      <i class="fa fa-home" aria-hidden="true"></i>
      Inicio
    </button>
    <div class="text-center mb-3 mt-3">
      <div class="row g-3 align-items-center">
        <div class="col-2">
          <label for="inputPassword6" class="col-form-label">Folio</label>
        </div>
        <div class="col-10">
          <input class="form-control" type="text" name="folio" id="folio" placeholder="folio" (keyup)="filterRFC()" [(ngModel)]='folio'>
        </div>
        <div class="col-2">
          <label for="inputPassword6" class="col-form-label">Tipos de Trámite</label>
        </div>
        <div class="col-10">
          <select class="form-select form-select-sm" aria-label=".form-select-sm example" #mySelectedTramite (click)="getTipoTramite(mySelectedTramite.value)">
            <option selected value="" > - Seleccionar un opción  - </option>
            <option  *ngFor="let tipoTramite of optionsTipoTramite" [value]="tipoTramite.name"
            > {{ tipoTramite.name }} </option>
          </select>
        </div>
        <div class="col-2">
          <label for="inputPassword6" class="col-form-label">Estatus</label>
        </div>
        <div class="col-10">
          <select class="form-select form-select-sm" aria-label=".form-select-sm example" #mySelectedStatus (click)="getEstatus(mySelectedStatus.value)">
            <option selected value="" > - Seleccionar un opción  - </option>
            <option  *ngFor="let tipoEstatus of optionsEstatus" [value]="tipoEstatus.name"
            > {{ tipoEstatus.name }} </option>
          </select>
        </div>
      </div>
    </div>

    <div class="row mt-5">
      <div class="col-6">
        <div class="export-title2">
          <div class="containerTabs-title">
            <button type="reset" class="btn border border-dark border-bottom-0 btn-paginador titleAdmin"  >
                Solicitudes
            </button>
            <button type="button" class="btn border border-dark border-bottom-0 btn-paginador" (click)="goAclaraciones()" >
              Aclaraciones
          </button>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="botones-accion" >
          <button class="btn button-export rounded" (click)="addSolicitud()" [disabled]="solicitudNgIf === 'Nueva'" >
            <i class="fas fa-sticky-note me-1"></i>
            <span>Nueva solicitud</span>
          </button>
        </div>

      </div>
    </div>

    <div class="result-body">
      <div class="header-table">
        <div class="head-td">Folio</div>
        <div class="head-td">RFC</div>
        <div class="head-td">Tipo Solicitud</div>
        <div class="head-td">Fecha Alta</div>
        <div class="head-td">Estatus</div>
        <div class="head-td button">Opciones</div>
      </div>

      <div [ngClass]="i%2 == 0 ? 'body-table row2' : 'body-table row1'" *ngFor="let item of solicitudes; let i = index;">

        <div class="body-td">{{item.numeroRegistro}}</div>
        <div class="body-td">{{item.rfcAsegurado}}</div>
        <div class="body-td">{{item.tipoTramite}}</div>
        <div class="body-td">{{item.fechaSolicitud}}</div>
        <div class="body-td">{{item.statusSolicitud}}</div>
        <div class="body-td button" [style.cursor]="'pointer'" (click)="verDetalleSolicitud(item)"><i class="material-icons iconDashboardAp" data-toggle="tooltip" data-placement="top" [title]="'Ir detalle'" >
          launch
          </i>Ver solicitud
        </div>
      </div>
      <section style="display: flex; flex-direction: column; align-items: center; opacity: 0.7; padding: 16px;" *ngIf="solicitudes.length == 0">
        <h2>Aquí serán mostradas tus consultas</h2>
        <p>Use el filtro de búsqueda</p>
      </section>
    </div>

  </div>

</div>
