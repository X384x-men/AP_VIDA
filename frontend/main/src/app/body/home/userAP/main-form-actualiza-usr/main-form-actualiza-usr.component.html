

<div class="margin-bottom">

  <div class="form-user-ap">
    <label class="titleListTables">Actualizar datos</label>
    <p class="nota-ap ">Favor llenar los campos que te solicitamos para que puedas actualizar la información de tu cuenta
    <br>Si actualizas tu contraseña asegurate de guardarla en un lugar donde puedas recordar
    <br>Si no deseas actualizar tu contraseña deja en blanco esos campos</p>
  </div>

  <div class="containerForm">
    <div class="form-user-ap-form">
      <app-form-user-data [user]="user" [isUpdate]="true" [dependenci]="dependenci"></app-form-user-data>
    </div>
  </div>

  <div class="button-ap">
    <button type="button" mat-raised-button color="warning" appBackButton>CANCELAR</button>
    <button type="button" mat-raised-button color="primary" (click)="guardar()">
      <mat-icon>check</mat-icon>
      GUARDAR
    </button>
  </div>

</div>
