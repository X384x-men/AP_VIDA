<mat-divider></mat-divider>
<section style="display: flex; justify-content: space-between; align-items: center; padding-left: 24px;">
  <mat-form-field appearance="legacy">
    <mat-label>Filtrar</mat-label>
    <input type="search" matInput #filterInput (keyup)="filterDependencies(filterInput.value)" name="filter" style="width: 400px">
  </mat-form-field>
  <button mat-stroked-button color="primary" (click)="openDependencieModal()" style="height: 40px;">
    <mat-icon>add_circle</mat-icon>
    Agregar dependencia
  </button>
</section>

<table mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let element">{{ element.idCatalogo }} </td>
  </ng-container>
  <ng-container matColumnDef="dependencie">
    <th mat-header-cell *matHeaderCellDef>Dependencia</th>
    <td mat-cell *matCellDef="let element">{{ element.descripcionCatalogo }}</td>
  </ng-container>
  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button (click)="updateDependency(element)">
        <i class="fa fa-solid fa-pen"></i>
      </button>
      <button mat-icon-button (click)="deleteDependency(element)">
        <i class="fa fa-solid fa-circle-xmark"></i>
      </button>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="['id', 'dependencie', 'action']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['id', 'dependencie', 'action']"></tr>
</table>
