<h1 mat-dialog-title>
  <mat-icon>{{isNew ? 'add_circle': 'edit'}}</mat-icon>
  <span>{{modalTitle}}</span>
</h1>
<form [formGroup]="adminUnitForm" (ngSubmit)="addAdminUnit()">
  <div mat-dialog-content>
    <mat-form-field appearance="legacy">
      <mat-label>Nombre de la unidad administrativa</mat-label>
      <input matInput formControlName="data" required />
    </mat-form-field>
  </div>
  <div mat-dialog-actions>
    <button type="submit" mat-flat-button color="primary" [disabled]="adminUnitForm.invalid">
      Guardar
    </button>
    <button mat-flat-button mat-dialog-close>Cancelar</button>
  </div>
</form>
